name: Stable validator dispatcher

# G17-WORKFLOW-SURFACE-MINIMIZATION (StegVerse-Labs/.github#167/#168), enforced
# retroactively under Rigel's 2026-10-24 direction (StegVerse-org/.github#166).
# This is StegVerse-Labs/FREE-DOM's stable validation surface (6 -> 3 workflow files). It runs
# the manifest tools/tasks/task_catalog.json: one matrix job per catalog group, each
# group being one job of a workflow folded here (verbatim records under
# tools/tasks/folded/), its steps the original run blocks byte for byte, pinned by
# sha256 and refused by `run_catalog.py verify` on any drift. Same file as
# StegVerse-Labs/StegDB .github/workflows/validation-dispatcher.yml @ eab2e773
# below this header. A new check is a catalog entry, never a new workflow file;
# control/workflow-surface-registry.json fails closed on an unregistered workflow.
# Actions are pinned by full commit SHA.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-dispatcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The catalog matches its pinned step bodies
        run: python3 tools/tasks/run_catalog.py verify
      - name: Select the catalog groups this event runs
        id: select
        run: echo "matrix=$(python3 tools/tasks/run_catalog.py matrix --event "$GITHUB_EVENT_NAME")" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CATALOG_EVENT_BEFORE: ${{ github.event.before }}
      CATALOG_EVENT_AFTER: ${{ github.event.after }}
      CATALOG_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CATALOG_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CATALOG_PR_NUMBER: ${{ github.event.pull_request.number }}
      CATALOG_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      CATALOG_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      CATALOG_PR_TITLE: ${{ github.event.pull_request.title }}
      CATALOG_PR_BODY: ${{ github.event.pull_request.body }}
      CATALOG_PR_HTML_URL: ${{ github.event.pull_request.html_url }}
      CATALOG_PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      CATALOG_RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: ${{ matrix.fetch_depth }}
          persist-credentials: ${{ matrix.persist_credentials }}
      - name: Second checkout the folded job made
        if: matrix.x_repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.x_repository }}
          ref: ${{ matrix.x_ref }}
          path: ${{ matrix.x_path }}
          fetch-depth: ${{ matrix.x_fetch_depth }}
          persist-credentials: ${{ matrix.x_persist_credentials }}
      - name: Python the folded job set up
        if: matrix.python_version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "${{ matrix.python_version }}"
      - name: Run the catalog group
        run: python3 tools/tasks/run_catalog.py run --group "${{ matrix.group }}"
      - name: Retain the artifact the folded job uploaded
        if: always() && matrix.artifact_name
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-artifacts
          if-no-files-found: ${{ matrix.artifact_if_no_files_found }}
